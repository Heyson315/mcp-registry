name: Pylint Code Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pylint:
    name: Run Pylint Code Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Check for Python files
        id: check-python
        run: |
          if find . -type f -name "*.py" -not -path "./.git/*" | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Install dependencies
        if: steps.check-python.outputs.has_python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          # Install project dependencies if requirements.txt exists
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      
      - name: Run Pylint
        if: steps.check-python.outputs.has_python == 'true'
        run: |
          find . -type f -name "*.py" -not -path "./.git/*" | xargs pylint
      
      - name: No Python files found
        if: steps.check-python.outputs.has_python == 'false'
        run: echo "No Python files found in repository, skipping Pylint checks"
